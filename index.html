<style>
:root{--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --lb:max(0px,calc((100vh - 100vw / 2.39) / 2))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#eef0f2;overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased}
body.idle{cursor:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.lb{position:fixed;left:0;right:0;height:var(--lb);background:#000;z-index:20;transition:height 2.5s cubic-bezier(.6,0,.2,1)}
.lb.t{top:0}.lb.b{bottom:0}
body.intro .lb{height:50vh}
#fade{position:fixed;inset:0;background:#000;z-index:19;pointer-events:none;opacity:1;transition:opacity 2.5s ease}
#fade.off{opacity:0}

/* start screen */
#start{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;transition:opacity 1.2s}
#start.gone{opacity:0;pointer-events:none}
#start .p{width:64px;height:64px;border:1px solid rgba(255,255,255,.35);border-radius:50%;display:grid;place-items:center}
#start .p::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
#start .s{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.55)}
#start .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.3);margin-top:30px;text-align:center;line-height:2}

/* overlays */
.ov{position:fixed;z-index:22;pointer-events:none}
#sub{left:50%;bottom:calc(var(--lb) + 5vh);transform:translateX(-50%);width:min(70vw,1200px);text-align:center;
  font-family:var(--serif);font-size:clamp(20px,1.95vw,36px);line-height:1.35;font-weight:600;color:#fff;letter-spacing:.005em;
  text-shadow:0 0 2px rgba(0,0,0,1),0 2px 6px rgba(0,0,0,.95),0 4px 30px rgba(0,0,0,.9);transition:opacity .9s ease}
#subbg{position:fixed;left:0;right:0;bottom:var(--lb);height:34vh;z-index:21;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.45) 45%,transparent);transition:opacity 1.2s}
#subbg.h{opacity:0}
#sub.h{opacity:0}
#lt{left:5.5vw;top:calc(var(--lb) + 7vh);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.1,1)}
#lt.h{opacity:0;transform:translateX(-20px)}
#lt .k{font-family:var(--mono);font-size:clamp(9px,.72vw,12px);letter-spacing:.3em;text-transform:uppercase;color:var(--acc,#9fdcff);display:flex;align-items:center;gap:12px}
#lt .k::before{content:"";width:34px;height:1px;background:currentColor}
#lt .n{font-family:var(--serif);font-weight:600;font-size:clamp(30px,3.3vw,62px);line-height:1.05;margin-top:.9vh;text-shadow:0 2px 20px rgba(0,0,0,.8)}
#lt .l{font-size:clamp(12px,.98vw,17px);color:rgba(255,255,255,.72);margin-top:.6vh;font-weight:300;letter-spacing:.02em;text-shadow:0 1px 10px rgba(0,0,0,.9)}
#chap{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#chap .num{font-family:var(--serif);font-weight:500;font-size:clamp(14px,1.1vw,20px);letter-spacing:.6em;color:var(--acc,#9fdcff);opacity:0;transition:opacity 2s .2s}
#chap .name{font-family:var(--serif);font-weight:500;font-size:clamp(56px,8.5vw,170px);line-height:1;letter-spacing:.55em;margin-right:-.55em;opacity:0;filter:blur(16px);
  transition:letter-spacing 4.5s cubic-bezier(.15,.7,.1,1),margin 4.5s cubic-bezier(.15,.7,.1,1),opacity 2.4s,filter 2.4s;text-shadow:0 0 60px rgba(0,0,0,.6)}
#chap .tag{font-family:var(--mono);font-size:clamp(9px,.78vw,13px);letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:3vh;opacity:0;transition:opacity 2s 1.2s}
#chap.on .num,#chap.on .tag{opacity:1}
#chap.on .name{letter-spacing:.06em;margin-right:-.06em;opacity:1;filter:none}
#chap.out .num,#chap.out .name,#chap.out .tag{opacity:0;filter:blur(10px);transition:opacity 1.6s,filter 1.6s}
#big{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:26vh;text-align:center;gap:3vh;transition:opacity 1.4s}
#big.h{opacity:0}
#big .w{font-family:var(--serif);font-weight:500;font-size:clamp(40px,5.6vw,110px);line-height:1;display:flex;gap:.5em;flex-wrap:wrap;justify-content:center}
#big .w span{opacity:0;filter:blur(14px);transform:translateY(14px);transition:all 2s cubic-bezier(.2,.7,.1,1)}
#big:not(.h) .w span{opacity:1;filter:none;transform:none}
#big .w span:nth-child(2){transition-delay:.7s}#big .w span:nth-child(3){transition-delay:1.4s}
#big .t{font-family:var(--mono);font-size:clamp(9px,.78vw,13px);letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.5);opacity:0;transition:opacity 2s 2.4s}
#big:not(.h) .t{opacity:1}
.c1{color:#8fd8ff}.c2{color:#ffb766}.c3{color:#ff7d4d}
#q{inset:0;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity 1.6s}
#q.h{opacity:0}
#q div{font-family:var(--serif);font-weight:500;font-size:clamp(38px,5vw,96px);line-height:1.08;max-width:1200px;text-shadow:0 0 50px rgba(0,0,0,.7)}
#q em{font-style:italic}
#cred{left:0;right:0;top:calc(var(--lb));bottom:calc(var(--lb));overflow:hidden;transition:opacity 1.5s;-webkit-mask:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
#cred.h{opacity:0}
#roll{position:absolute;left:50%;width:min(760px,86vw);transform:translate(-50%,100vh);text-align:center}
#cred:not(.h) #roll{animation:roll 70s linear forwards}
@keyframes roll{to{transform:translate(-50%,-100%)}}
#roll h4{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.45);margin:9vh 0 2.4vh}
#roll h3{font-family:var(--serif);font-weight:600;font-size:clamp(28px,2.6vw,46px);margin-bottom:1.6vh}
#roll p{font-size:clamp(13px,1.02vw,17px);line-height:1.6;color:rgba(255,255,255,.78);font-weight:300;margin-bottom:1.1vh}
#roll p b{display:block;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.42);margin-bottom:.3vh}
#roll .src{font-family:var(--mono);font-size:11px;line-height:2.1;color:rgba(255,255,255,.5)}
#roll .end{font-family:var(--serif);font-size:clamp(24px,2vw,36px);margin:12vh 0 40vh}
#ctr{position:fixed;right:22px;bottom:max(6px,calc(var(--lb) / 2 - 7px));z-index:21;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.28)}
#notes{position:fixed;right:18px;top:calc(var(--lb) + 16px);width:min(400px,38vw);background:rgba(8,9,11,.9);border:1px solid rgba(255,255,255,.12);padding:14px 16px;z-index:45;font-size:14px;line-height:1.55;color:#dfe3e7;display:none}
#notes.show{display:block}
#notes .m{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#8d969f;display:flex;justify-content:space-between;margin-bottom:8px;text-transform:uppercase}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;font-family:var(--mono);font-size:13px;color:#aaa;text-align:center;padding:30px;line-height:1.8}
</style>

</div>

<div class="ov h" id="q"><div>Яка метафора найточніше описує<br>вашу організацію: <em class="c1">мозок</em>, <em class="c2">культура</em> чи <em class="c3">грати</em>?</div></div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const $=s=>document.querySelector(s);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const rnd=(a,b)=>a+Math.random()*(b-a);
const frac=x=>x-Math.floor(x);

/* ============ renderer / scene ============ */
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.VSMShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x06070b,.0042);scene.background=new THREE.Color(0x06070b);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.5,2500);
camera.position.set(0,4,140);
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.8,.6,.14);composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},uTime:{value:0},uFlick:{value:1},uRes:{value:new THREE.Vector2(innerWidth,innerHeight)}},
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`uniform sampler2D tDiffuse;uniform float uTime,uFlick;uniform vec2 uRes;varying vec2 vUv;
 float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
 void main(){vec2 uv=vUv;vec2 c=uv-.5;float r=dot(c,c);float ca=.0012+r*.007;vec3 col;
  col.r=texture2D(tDiffuse,uv+c*ca).r;col.g=texture2D(tDiffuse,uv).g;col.b=texture2D(tDiffuse,uv-c*ca).b;
  col*=1.-smoothstep(.1,.6,r)*.8;
  float l=dot(col,vec3(.299,.587,.114));col=mix(col,col*vec3(.9,1.,1.08),(1.-l)*.35);col=mix(col,col*vec3(1.07,1.,.9),clamp(l,0.,1.)*.3);
  float g=h(floor(uv*uRes*.75)+fract(uTime*7.)*91.)-.5;col+=g*.075*(1.-l*.5);
  gl_FragColor=vec4(col*uFlick,1.);}`});
composer.addPass(grade);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();grade.uniforms.uRes.value.set(innerWidth,innerHeight);});
scene.add(new THREE.AmbientLight(0x30343c,.35));

const ROOM={pro:V(0,0,0),brain:V(0,0,-520),cult:V(0,0,-1040),pri:V(0,0,-1560)};
const FOG={pro:new THREE.Color(0x05060a),brain:new THREE.Color(0x030913),cult:new THREE.Color(0x140a04),pri:new THREE.Color(0x050302)};
const ACC={pro:'#d9dee3',brain:'#8fd8ff',cult:'#ffb766',pri:'#ff7d4d'};

/* ============ point shader ============ */
function pointsMat(size){return new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 uniforms:{uTime:{value:0},uSize:{value:size},uSync:{value:0},uTw:{value:0},uPix:{value:renderer.getPixelRatio()},uFogC:{value:new THREE.Color()},uGain:{value:1}},
 vertexShader:`attribute vec3 color;attribute float aSeed;uniform float uTime,uSize,uSync,uTw,uPix,uGain;varying vec3 vC;varying float vA;
 void main(){vec4 mv=modelViewMatrix*vec4(position,1.);
  float own=.35+.65*(.5+.5*sin(uTime*1.9+aSeed*61.));float syn=.25+.75*pow(.5+.5*sin(uTime*1.9),2.);
  float tw=mix(1.,mix(own,syn,uSync),uTw);
  float fog=1.-exp(-pow(-mv.z*.0042,2.)*1.);vA=tw*(1.-clamp(fog,0.,1.))*uGain;vC=color;
  gl_PointSize=clamp(uSize*(.55+aSeed*.9)*uPix*(300./-mv.z),0.,90.);gl_Position=projectionMatrix*mv;}`,
 fragmentShader:`varying vec3 vC;varying float vA;void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,.0,d);a*=a;if(a<.01)discard;gl_FragColor=vec4(vC*a*vA,1.);}`});}

/* ============ swarm ============ */
const N=6000;
const pos=new Float32Array(N*3),col=new Float32Array(N*3),seed=new Float32Array(N),seed2=new Float32Array(N);
const fromP=new Float32Array(N*3),fromC=new Float32Array(N*3),tP=new Float32Array(N*3),tC=new Float32Array(N*3);
for(let i=0;i<N;i++){seed[i]=Math.random();seed2[i]=Math.random();pos[i*3]=rnd(-150,150);pos[i*3+1]=rnd(-80,80);pos[i*3+2]=rnd(-150,150);}
const sGeo=new THREE.BufferGeometry();
sGeo.setAttribute('position',new THREE.BufferAttribute(pos,3).setUsage(THREE.DynamicDrawUsage));
sGeo.setAttribute('color',new THREE.BufferAttribute(col,3).setUsage(THREE.DynamicDrawUsage));
sGeo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
const sMat=pointsMat(1.6);const swarm=new THREE.Points(sGeo,sMat);swarm.frustumCulled=false;scene.add(swarm);

/* bases */
function brainBase(){const a=new Float32Array(N*3);for(let i=0;i<N;i++){const h=i%2?1:-1;const u=Math.random()*2-1,th=Math.random()*Math.PI*2,s=Math.sqrt(1-u*u);
  let x=s*Math.cos(th),y=u,z=s*Math.sin(th);const fold=1+.075*Math.sin(x*9+y*7)*Math.sin(z*8-y*5)+.04*Math.sin(z*17+x*4);
  const r=(Math.random()<.86?.94+Math.random()*.06:Math.random()*.85)*fold;x*=r*12;y*=r*14;z*=r*21;if(x*h<0)x*=.22;
  if(z>6&&y<-4)y*=1.15;a[i*3]=x+h*12.8;a[i*3+1]=y-1;a[i*3+2]=z;}return a;}
const BRAIN=brainBase();
const BRCOL=new Float32Array(N*3);for(let i=0;i<N;i++){const w=Math.random()<.08?1:.0;const b=(.45+.55*Math.random())*.62;BRCOL[i*3]=(.35+w*.6)*b;BRCOL[i*3+1]=(.72+w*.25)*b;BRCOL[i*3+2]=1*b;}
const EDGES=[];(()=>{const M=1500;for(let i=0;i<M;i++){const d=[];for(let j=0;j<M;j++){if(i===j)continue;const dx=BRAIN[i*3]-BRAIN[j*3],dy=BRAIN[i*3+1]-BRAIN[j*3+1],dz=BRAIN[i*3+2]-BRAIN[j*3+2];d.push([dx*dx+dy*dy+dz*dz,j]);}
  d.sort((a,b)=>a[0]-b[0]);for(let k=0;k<2;k++)if(d[k][0]<40&&i<d[k][1])EDGES.push(i,d[k][1]);}})();
const SPH=new Float32Array(N*3);for(let i=0;i<N;i++){const u=Math.random()*2-1,th=Math.random()*6.283,s=Math.sqrt(1-u*u),r=Math.cbrt(Math.random());SPH[i*3]=s*Math.cos(th)*r;SPH[i*3+1]=u*r;SPH[i*3+2]=s*Math.sin(th)*r;}
const GAUSS=new Float32Array(N*3);for(let i=0;i<N*3;i++){let g=0;for(let k=0;k<4;k++)g+=Math.random();GAUSS[i]=(g-2)/2;}

function rotY(x,z,a){const c=Math.cos(a),s=Math.sin(a);return[x*c+z*s,-x*s+z*c];}

/* logo sampling */
const LOGOS={};
const LOGO_META={monobank:{txt:'monobank',tint:[.9,.9,.95]},novaposhta:{txt:'Нова пошта',tint:[1,.3,.25]},fest:{txt:'!FEST',tint:[1,.72,.35]},macpaw:{txt:'MacPaw',tint:[.85,.9,1]},ukrposhta:{txt:'Укрпошта',tint:[1,.82,.25]},kodak:{txt:'Kodak',tint:[1,.75,.2]},paw:{tint:[1,.78,.5]},cherry:{tint:[1,.22,.28]}};
function sampleCanvas(cv,tint,keepColor){const w=cv.width,h=cv.height,d=cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
  const bg=[d[0],d[1],d[2],d[3]];const pts=[];const opaqueBg=bg[3]>200;
  for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){const i=(y*w+x)*4;if(d[i+3]<110)continue;
    if(opaqueBg&&Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2])<80)continue;
    let r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;const L=.3*r+.6*g+.1*b;
    if(!keepColor||L<.16){r=tint[0]*(.75+.25*Math.random());g=tint[1]*(.75+.25*Math.random());b=tint[2]*(.75+.25*Math.random());}
    pts.push(x/w-.5,.5-y/h,r,g,b);}
  return{pts,aspect:w/h,transparent:!opaqueBg};}
function buildLogo(s){const n=s.pts.length/5;const P=new Float32Array(N*3),C=new Float32Array(N*3);
  const W=Math.min(76,34*s.aspect),H=W/s.aspect;const jit=2/600*W;
  for(let i=0;i<N;i++){const k=(n>N?Math.floor(Math.random()*n):i%n)*5;P[i*3]=s.pts[k]*W+rnd(-jit,jit);P[i*3+1]=s.pts[k+1]*H+rnd(-jit,jit);P[i*3+2]=rnd(-.8,.8);
    const f=.62;C[i*3]=s.pts[k+2]*f;C[i*3+1]=s.pts[k+3]*f;C[i*3+2]=s.pts[k+4]*f;}return{P,C,W,H};}
function textCanvas(txt){const c=document.createElement('canvas');const x=c.getContext('2d');const f='600 200px Manrope, sans-serif';x.font=f;const w=Math.ceil(x.measureText(txt).width)+60;c.width=w;c.height=280;x.font=f;x.fillStyle='#fff';x.textBaseline='middle';x.fillText(txt,30,145);return c;}
function pawCanvas(){const c=document.createElement('canvas');c.width=c.height=500;const x=c.getContext('2d');x.fillStyle='#fff';x.beginPath();x.ellipse(250,320,110,95,0,0,7);x.fill();
  [[110,190,40,52,-.4],[195,120,42,56,-.15],[305,120,42,56,.15],[390,190,40,52,.4]].forEach(([a,b,r1,r2,rt])=>{x.beginPath();x.ellipse(a,b,r1,r2,rt,0,7);x.fill();});return c;}
function cherryCanvas(){const c=document.createElement('canvas');c.width=c.height=560;const x=c.getContext('2d');x.fillStyle='#fff';x.strokeStyle='#fff';x.lineCap='round';x.lineWidth=16;
  x.beginPath();x.moveTo(300,90);x.quadraticCurveTo(230,200,170,360);x.stroke();x.beginPath();x.moveTo(300,90);x.quadraticCurveTo(340,220,385,390);x.stroke();
  x.beginPath();x.arc(165,405,82,0,7);x.fill();x.beginPath();x.arc(390,425,78,0,7);x.fill();x.beginPath();x.ellipse(375,90,78,30,-.35,0,7);x.fill();return c;}

async function prepLogo(key){const m=LOGO_META[key];let L=null,plane=null;

addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(dx>50)prev();},{passive:true});
let idle;addEventListener('mousemove',()=>{document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>document.body.classList.add('idle'),2200);});

/* ============ sound ============ */
let AC=null,master=null,soundOn=false;
function toggleSound(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;lp.connect(master);
  [[55,'sine',.5],[82.4,'triangle',.16],[110.2,'sine',.2],[164.8,'sine',.06],[220.5,'sine',.03]].forEach(([f,ty,g])=>{const o=AC.createOscillator(),gg=AC.createGain();o.type=ty;o.frequency.value=f;gg.gain.value=g;o.connect(gg);gg.connect(lp);o.start();
    const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.04+Math.random()*.08;lg.gain.value=g*.45;l.connect(lg);lg.connect(gg.gain);l.start();});}
  soundOn=!soundOn;master.gain.cancelScheduledValues(AC.currentTime);master.gain.linearRampToValueAtTime(soundOn?.17:0,AC.currentTime+1.5);if(AC.state==='suspended')AC.resume();}
function whoosh(big){if(!soundOn||!AC)return;const t=AC.currentTime,len=AC.sampleRate*(big?2.4:1.3);const buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);
  const src=AC.createBufferSource();src.buffer=buf;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.1;bp.frequency.setValueAtTime(220,t);bp.frequency.exponentialRampToValueAtTime(big?1800:1100,t+(big?1.2:.6));bp.frequency.exponentialRampToValueAtTime(180,t+(big?2.3:1.2));
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(big?.3:.1,t+(big?1:.45));g.gain.exponentialRampToValueAtTime(.001,t+(big?2.35:1.25));src.connect(bp);bp.connect(g);g.connect(AC.destination);src.start(t);
  if(big){const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(62,t+1.3);o.frequency.exponentialRampToValueAtTime(30,t+4);og.gain.setValueAtTime(0,t+1.3);og.gain.linearRampToValueAtTime(.5,t+1.36);og.gain.exponentialRampToValueAtTime(.001,t+4.2);o.connect(og);og.connect(AC.destination);o.start(t+1.3);o.stop(t+4.3);}}

/* ============ loop ============ */
let last=performance.now();const tmpL=V(0,0,0);
function frame(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;now=ts/1000;const s=SHOTS[cur]||SHOTS[0];
  // camera
  const k=ease((now-camT0)/camDur);camera.position.lerpVectors(camFrom,camTo,k);camera.position.y+=Math.sin(Math.PI*k)*camArc;
  const el=Math.max(0,now-camT0-camDur);const dir=tmpL.copy(lookTo).sub(camTo).normalize();camera.position.addScaledVector(dir,Math.min(el,40)*.28);
  camera.position.x+=Math.sin(now*.31)*.35+Math.sin(now*.83)*.12;camera.position.y+=Math.sin(now*.27+1)*.28+Math.sin(now*.71)*.1;
  look.lerpVectors(lookFrom,lookTo,ease((now-camT0)/(camDur*.9)));tmpL.copy(look);tmpL.x+=Math.sin(now*.23)*.25;tmpL.y+=Math.cos(now*.19)*.2;camera.lookAt(tmpL);
  // fog
  scene.fog.color.lerp(fogT,1-Math.exp(-dt*1.1));scene.background.copy(scene.fog.color);
  // swarm
  form.fill(formO,now);
  for(let i=0;i<N;i++){const kk=ease((now-trT0-seed[i]*trSpread)/trDur);const i3=i*3;
    if(kk>=1){pos[i3]=tP[i3];pos[i3+1]=tP[i3+1];pos[i3+2]=tP[i3+2];col[i3]=tC[i3];col[i3+1]=tC[i3+1];col[i3+2]=tC[i3+2];}
    else{const arc=Math.sin(Math.PI*kk)*(camArc?22:4)*(seed2[i]-.3);const bs=burst?Math.sin(Math.PI*kk)*(burst===2?30:16):0;pos[i3]=fromP[i3]+(tP[i3]-fromP[i3])*kk+GAUSS[i3]*bs;pos[i3+1]=fromP[i3+1]+(tP[i3+1]-fromP[i3+1])*kk+arc+GAUSS[i3+1]*bs;pos[i3+2]=fromP[i3+2]+(tP[i3+2]-fromP[i3+2])*kk+GAUSS[i3+2]*bs;
      col[i3]=fromC[i3]+(tC[i3]-fromC[i3])*kk;col[i3+1]=fromC[i3+1]+(tC[i3+1]-fromC[i3+1])*kk;col[i3+2]=fromC[i3+2]+(tC[i3+2]-fromC[i3+2])*kk;}}
  sGeo.attributes.position.needsUpdate=true;sGeo.attributes.color.needsUpdate=true;
  const u=sMat.uniforms;u.uTime.value=now;u.uSize.value+=(sizeT-u.uSize.value)*(1-Math.exp(-dt*1.2));u.uTw.value+=(twT-u.uTw.value)*(1-Math.exp(-dt));u.uSync.value+=(syncT-u.uSync.value)*(1-Math.exp(-dt*.45));
  // logo plane
  for(const key in LOGOS){const L=LOGOS[key];if(!L.plane)continue;const on=form.logo===key&&now-trT0>trDur+trSpread+.6;const m=L.plane.material;m.opacity+=((on?.9:0)-m.opacity)*(1-Math.exp(-dt*(on?.8:3)));L.plane.visible=m.opacity>.01;if(form.logo===key){L.plane.position.copy(formO);L.plane.position.z+=1;}}
  // brain lines + pulses
  const brainOn=form===FORMS.brain&&now-trT0>trDur*.7?1:0;lineT+=(brainOn-lineT)*(1-Math.exp(-dt*(brainOn?1.2:7)));lMat.opacity=lineT*.32;lines.visible=lineT>.01;
  if(lines.visible){for(let e=0;e<EDGES.length;e++){const a=EDGES[e]*3;lPos[e*3]=pos[a];lPos[e*3+1]=pos[a+1];lPos[e*3+2]=pos[a+2];}lGeo.attributes.position.needsUpdate=true;}
  pulseBoost+=((s.pulse?1:.35)-pulseBoost)*(1-Math.exp(-dt*2));const pw=lineT*pulseBoost;
  for(let p=0;p<NPUL;p++){const q=pul[p];q.u+=q.sp*dt*(.6+pulseBoost);if(q.u>=1){q.u=0;q.e=Math.random()*(EDGES.length/2)|0;q.sp=rnd(.7,1.8);}
    const a=EDGES[q.e*2]*3,b=EDGES[q.e*2+1]*3;const uu=q.dir?q.u:1-q.u;pPos[p*3]=pos[a]+(pos[b]-pos[a])*uu;pPos[p*3+1]=pos[a+1]+(pos[b+1]-pos[a+1])*uu;pPos[p*3+2]=pos[a+2]+(pos[b+2]-pos[a+2])*uu;
    const br=pw*Math.sin(Math.PI*q.u)*1.4;pCol[p*3]=br*.85;pCol[p*3+1]=br*.95;pCol[p*3+2]=br;}
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;pulses.visible=pw>.01;pMat.uniforms.uTime.value=now;
  // rings
  ringW+=((s.rings?1:0)-ringW)*(1-Math.exp(-dt*1.3));rings.visible=ringW>.01;
  if(rings.visible){const o=ROOM.brain;for(let i=0;i<NR;i++){const outer=i>=NR*.45;const R=outer?44:31;const a=rSeed[i]*6.283+now*(outer?-.18:.32);const tilt=outer?.5:.25;
      const x=Math.cos(a)*R,y=Math.sin(a)*R*.6,z=Math.sin(a)*R*.8;rPos[i*3]=o.x+x;rPos[i*3+1]=o.y+y*Math.cos(tilt)+(outer?6:-2);rPos[i*3+2]=o.z+z*.9;
      const fl=Math.pow(frac(rSeed[i]*5-now*(outer?.25:.45)),6);const b=ringW*(.25+fl*1.2);rCol[i*3]=outer?b:b*.45;rCol[i*3+1]=outer?b*.85:b*.85;rCol[i*3+2]=outer?b*.6:b;}
    rGeo.attributes.position.needsUpdate=true;rGeo.attributes.color.needsUpdate=true;rMat.uniforms.uTime.value=now;}
  // motes
  const cp=camera.position;for(let i=0;i<NM;i++){const i3=i*3;mOff[i3+1]+=Math.sin(now*.3+i)*.01;mPos[i3]=cp.x+((mOff[i3]-cp.x)%120+180)%120-60;mPos[i3+1]=cp.y+((mOff[i3+1]-cp.y)%70+105)%70-35;mPos[i3+2]=cp.z+((mOff[i3+2]-cp.z)%120+180)%120-60;
    const c=fogT===FOG.cult?[.3,.2,.1]:fogT===FOG.pri?[.3,.16,.08]:[.16,.2,.26];mCol[i3]=c[0];mCol[i3+1]=c[1];mCol[i3+2]=c[2];}
  mGeo.attributes.position.needsUpdate=true;mGeo.attributes.color.needsUpdate=true;mMat.uniforms.uTime.value=now;
  for(const b of BEAMS)b.visible=camera.position.distanceTo(b.position)<330;
  // cave
  const near=camera.position.distanceTo(P0)<420;
  if(near){const f=.8+.12*Math.sin(now*6.3)+.07*Math.sin(now*11.7+1)+.04*Math.sin(now*23.1);fireL.intensity=.55*f;spot.intensity=4.2*f+dawnW*1.2;
    fires.forEach((sp,i)=>{const s2=(9-i*1.6)*(f+.1*Math.sin(now*9+i));sp.scale.set(s2*.9,s2*1.3,1);sp.material.opacity=.75*f;});
    for(const w of walkers){w.position.x+=w.userData.v*dt;if(w.position.x>P0.x+120)w.position.x=P0.x-120;const ph=w.position.x*.22+w.userData.ph;w.userData.legs[0].rotation.x=Math.sin(ph)*.45;w.userData.legs[1].rotation.x=-Math.sin(ph)*.45;w.position.y=P0.y-21+Math.abs(Math.sin(ph))*.4;}}
  spot.castShadow=near;
  dawnW+=((s.dawn?1:0)-dawnW)*(1-Math.exp(-dt*(s.dawn?.6:2.5)));dawn.material.opacity=dawnW*.3;dawn.visible=dawnW>.01;
  // bars
  for(const b of bars){const d=b.userData;const ready=now-barT0>d.i*.13;let tg;if(barState==='down')tg={x:d.x,y:28,rz:0};else if(barState==='break')tg={x:d.x+d.side*(70+d.i*9),y:28+rnd(-.1,.1),rz:d.side*-.5};else tg={x:d.x,y:200,rz:0};
    if(ready){const r=barState==='down'?1-Math.exp(-dt*4.5):1-Math.exp(-dt*1.6);d.cur.x+=(tg.x-d.cur.x)*r;d.cur.y+=(tg.y-d.cur.y)*r;d.cur.rz+=(tg.rz-d.cur.rz)*r;}
    if(barState==='break'){d.cur.x=d.x;d.cur.y=200;d.cur.rz=0;}b.position.set(P0.x+d.cur.x,P0.y+d.cur.y,P0.z+30);b.rotation.z=d.cur.rz;b.visible=barState!=='break'&&d.cur.y<150;}
  // film
  const fv=s.film?1:0;filmMat.uniforms.uOp.value+=(fv-filmMat.uniforms.uOp.value)*(1-Math.exp(-dt*1.5));film.visible=filmMat.uniforms.uOp.value>.01;filmMat.uniforms.uOff.value=now*.035;
  filmMat.uniforms.uBurn.value=s.film==='burn'?clamp((now-shotT0-1.2)/24,0,.6):0;
  // post
  grade.uniforms.uTime.value=now;grade.uniforms.uFlick.value=.985+Math.random()*.025;bloom.strength=(fogT===FOG.pri?.55:.8)+dawnW*.4;
  if(started){const e=(ts-t0Real)/1000;$('#nT').textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(Math.floor(e%60)).padStart(2,'0');}
  composer.render();requestAnimationFrame(frame);}

(async()=>{try{await document.fonts.ready;}catch(e){}
  await Promise.all(Object.keys(LOGO_META).map(prepLogo));prepTexts();
  for(let i=0;i<N;i++){pos[i*3]=GAUSS[i*3]*.3;pos[i*3+1]=GAUSS[i*3+1]*.3;pos[i*3+2]=GAUSS[i*3+2]*.3;const b=i<300?.9:0;col[i*3]=b;col[i*3+1]=b*.95;col[i*3+2]=b*.85;}FORMS.spark={size:1.4,tw:.6,fill(o,t){tP.set(pos);tC.set(col);}};form=FORMS.spark;fromP.set(pos);fromC.set(col);trT0=-99;sMat.uniforms.uSize.value=1.4;
  camera.position.set(0,0,70);look.set(0,0,0);camFrom.copy(camera.position);camTo.copy(camera.position);
  requestAnimationFrame(frame);
  $('#start').addEventListener('click',e=>{e.stopPropagation();begin();});
  window.__film={go:i=>{if(!started)begin();go(i);},n:SHOTS.length};
})();
window.addEventListener('error',e=>{if(String(e.message).includes('WebGL')){$('#err').style.display='flex';$('#err').textContent='Браузер не підтримує WebGL. Відкрийте у свіжому Chrome.';}});
